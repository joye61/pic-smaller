name: Build image-tool AMD64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AMD64 image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag local/image-tool:initial \
            .

      - name: Export image
        run: |
          docker save local/image-tool:initial \
            | gzip -9 \
            > /tmp/image-tool-initial-amd64.tar.gz

          sha256sum /tmp/image-tool-initial-amd64.tar.gz
          ls -lh /tmp/image-tool-initial-amd64.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-tool-initial-amd64
          path: /tmp/image-tool-initial-amd64.tar.gz
          retention-days: 3
          compression-level: 0
